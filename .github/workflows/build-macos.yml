name: Build & Release macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG Installer & Portable Archive
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & macOS environment
        run: flutter doctor -v

      - name: Run Monorepo Unit & Integration Tests
        run: |
          cd packages/billing_engine && dart test
          cd ../database && dart test
          cd ../sync_protocol && dart test
          cd ../../apps/desktop && flutter test

      - name: Build macOS Release App
        run: |
          cd apps/desktop
          flutter build macos --release

      - name: Create Native macOS DMG Installer & Zip Archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APP_DIR="$GITHUB_WORKSPACE/apps/desktop/build/macos/Build/Products/Release"
          APP_NAME="WebotApp Departmental POS.app"
          
          # 1. Create portable zip archive
          echo "Packaging standalone macOS zip archive..."
          cd "$APP_DIR"
          zip -r -y "$GITHUB_WORKSPACE/dist/WebotApp-Departmental-POS-macOS-v1.0.0.zip" "$APP_NAME"
          cd "$GITHUB_WORKSPACE"

          # 2. Build native Apple Disk Image (DMG) with drag-and-drop /Applications shortcut
          echo "Building native macOS DMG installer..."
          mkdir -p dmg_staging
          cp -R "$APP_DIR/$APP_NAME" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "WebotApp Departmental POS" -srcfolder dmg_staging -ov -format UDZO "$GITHUB_WORKSPACE/dist/WebotApp-Departmental-POS-v1.0.0.dmg"
          rm -rf dmg_staging

          echo "Generated distribution files in dist:"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebotApp-Departmental-POS-macOS
          path: |
            dist/WebotApp-Departmental-POS-v1.0.0.dmg
            dist/WebotApp-Departmental-POS-macOS-v1.0.0.zip

      - name: Publish DMG & ZIP to GitHub Release v1.0.0
        run: |
          echo "Attaching macOS DMG and ZIP installer to GitHub Release v1.0.0..."
          gh release upload v1.0.0 \
            dist/WebotApp-Departmental-POS-v1.0.0.dmg \
            dist/WebotApp-Departmental-POS-macOS-v1.0.0.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
